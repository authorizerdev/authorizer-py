[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authorizer-py"
version = "0.3.0rc3"
description = "Python SDK for authorizer.dev — self-hosted authentication & authorization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "The Authorizer Authors" }]
keywords = ["authorizer", "authentication", "authorization", "oauth", "openid", "fga", "openfga"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# authorizer-proto ships the generated proto message + gRPC stubs (was vendored
# under _grpc). protobuf stays a direct dep because the REST protocol parses
# grpc-gateway responses with protojson (int64-as-string + single-field wrappers)
# using those message types. grpcio is only needed for the optional ``grpc``
# protocol (pulled via authorizer-proto[grpc]).
#
# authorizer-proto is pinned at >=0.2.0rc1: rc1 replaced DeleteUserRequest.email
# with .id, and this SDK's delete_user builds the id form. An older SDK paired
# with rc1 (or this SDK with rc0) breaks at that call, so the floor moves with
# the break rather than floating across it.
dependencies = ["httpx>=0.24,<1", "protobuf>=4", "authorizer-proto>=0.2.0rc1"]

[project.optional-dependencies]
grpc = ["authorizer-proto[grpc]>=0.2.0rc1", "grpcio>=1.60", "protobuf>=4"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.5",
    "mypy>=1.8",
    "grpcio>=1.60",
    "protobuf>=4",
]

[project.urls]
Homepage = "https://authorizer.dev"
Documentation = "https://docs.authorizer.dev"
Source = "https://github.com/authorizerdev/authorizer-python"

[tool.hatch.build.targets.wheel]
packages = ["src/authorizer"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true

# Generated proto/gRPC stubs (authorizer-proto package) — untyped, not checked.
[[tool.mypy.overrides]]
module = "authorizer_proto.*"
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests that hit a real Authorizer server (deselect with -m 'not live')",
]
